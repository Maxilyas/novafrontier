name: Tests & Lint

# Double filet : sur les PR vers dev (avant la review Claude) et sur les PR
# vers main (avant que quoi que ce soit parte en prod).
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Le monorepo n'existe pas encore (phase P0 du plan). Sans ce garde-fou,
      # le job echouerait en rouge sur les premieres PR. A supprimer une fois
      # le socle en place.
      - name: Detecte le projet
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas encore de package.json - job ignore."
          fi

      # pnpm/action-setup doit passer AVANT setup-node, sinon cache: pnpm
      # ne trouve pas le store.
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.found == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        if: steps.detect.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      # -r : recursif sur tous les packages du workspace (apps/*, packages/*).
      # --if-present : le job ne casse pas si le script n'existe pas encore.
      - name: Lint (Biome)
        if: steps.detect.outputs.found == 'true'
        run: pnpm -r --if-present lint

      - name: Typecheck
        if: steps.detect.outputs.found == 'true'
        run: pnpm -r --if-present typecheck

      - name: Tests (Vitest)
        if: steps.detect.outputs.found == 'true'
        run: pnpm -r --if-present test

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: pnpm -r --if-present build
