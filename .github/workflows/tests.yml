name: Tests & Lint

# Sur chaque PR vers main, avant le merge. La review de code se fait sur la PR,
# par l'equipe avec Claude (voir WORKFLOW.md), pas dans la CI.
on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm/action-setup doit passer AVANT setup-node, sinon cache: pnpm
      # ne trouve pas le store. La version de pnpm vient du champ
      # packageManager de package.json : ne pas la repeter ici, l'action
      # refuse deux versions differentes.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # -r : recursif sur tous les packages du workspace (apps/*, packages/*).
      # --if-present : un package sans le script est simplement saute.
      - name: Lint (Biome)
        run: pnpm -r --if-present lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Tests (Vitest)
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm -r --if-present build

      # Tests de bout en bout et audit de performance de l'application web (phase P0 de la
      # feuille de route). Chromium de Playwright, avec ses dependances systeme.
      - name: Installation de Chromium
        run: pnpm --filter @nova/web exec playwright install --with-deps chromium

      - name: Tests de bout en bout (Playwright)
        run: pnpm --filter @nova/web test:e2e

      - name: Performance (Lighthouse)
        run: pnpm --filter @nova/web perf

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: apps/web/playwright-report
          retention-days: 7
